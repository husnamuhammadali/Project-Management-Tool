<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        
        nav {
            background-color: #2c3e50;
            padding: 15px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        
        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        
        h1,
        h2 {
            color: #2c3e50;
        }
        
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1a252f;
        }
        
        .message {
            color: green;
            font-weight: bold;
        }
        
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </nav>
    <div class="container">

        {% if messages %} {% for message in messages %}
        <p class="{% if message.tags == 'error' %}error{% else %}message{% endif %}">
            {{ message }}
        </p>
        {% endfor %} {% endif %} {% block content %} {% endblock %}
    </div>

</body>

</html>
